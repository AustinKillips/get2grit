  <section class="expo-group"><h2>Vendors</h2><div class="workshop-list"><details class="workshop vendor-card physical-therapy"><summary><h3 class="workshop-title">Physical Therapy</h3><span class="clinic-arrow" aria-hidden="true"></span><span class="workshop-meta"><span><span class="inverse-label">TIME:</span> <mark>Throughout the weekend</mark></span></span><span class="workshop-presenters"><span class="inverse-label">PROVIDER:</span> <span class="vendor-name">Madison Haley, PT, DPT</span></span><a class="workshop-location" data-coordinates="">DROP IN</a></summary><div class="workshop-body"><div class="workshop-description"><span class="description-label">Details</span><p>Madison Haley is once again joining us to offer up their physical therapy and massage services for anyone in need!<br><br>As one of the few local LGBTQ+ practitioners in their field, Madison is passionate about helping the queer community find safe, affirming providers they can trust.</p></div></div></details><details class="workshop vendor-card"><summary><h3 class="workshop-title">Darkhorse Clay</h3><span class="clinic-arrow" aria-hidden="true"></span><span class="workshop-meta"><span><span class="inverse-label">TIME:</span> <mark>11:00–5:00PM</mark></span></span><span class="workshop-presenters"><span class="inverse-label">MERCHANT:</span> <span class="vendor-name">Allison Ousley</span></span><a class="workshop-location" data-coordinates="">DROP IN</a></summary><div class="workshop-body"><div class="workshop-description"><span class="description-label">Details</span><p>Allison Ousley is a local ceramicist and local ripper on the bike! Check out her rad resist designs and be sure to say hello as she muscles up the Leatherwood hills on her singlespeed!</p></div></div></details><details class="workshop vendor-card"><summary><h3 class="workshop-title">Grit Thrift Mart</h3><span class="clinic-arrow" aria-hidden="true"></span><span class="workshop-meta"><span><span class="inverse-label">TIME:</span> <mark>11:00–5:00PM</mark></span></span><span class="workshop-presenters"><span class="inverse-label">MERCHANT:</span> <span class="vendor-name">ALL BIKES WELCOME</span></span><a class="workshop-location" data-coordinates="">DROP IN</a></summary><div class="workshop-body"><div class="workshop-description"><span class="description-label">Details</span><p>We thrifted and screenprinted 70 garments just for you!<br><br>Come peruse our wares and make it in time to leave with one of our rare one-of-one Grit Fest babydoll t shirts!</p></div></div></details><details class="workshop vendor-card punk-truck-stop"><summary><h3 class="workshop-title">Punk Truck Stop</h3><span class="clinic-arrow" aria-hidden="true"></span><span class="workshop-meta"><span><span class="inverse-label">TIME:</span> <mark>10:00–5:00PM</mark></span></span><span class="workshop-presenters"><span class="inverse-label">MERCHANT:</span> <span class="vendor-name">a local punk</span></span><a class="workshop-location" data-coordinates="">DROP IN</a></summary><div class="workshop-body"><div class="workshop-description"><span class="description-label">Details</span><p>The punk truck stop is a load bearing piece of cultural and social infrastructure in Northwest Arkansas. They sell a variety of wares and ensure that live music acts have a space to perform that will not induce psychic damage.</p></div></div></details></div></section><section class="expo-group"><h2>Activities</h2><div class="workshop-list"><details class="workshop">

        <div class="workshop-description"><span class="description-label">Description</span><p>Cyanotype printing presented by the soon-to-be open Silver House Community Dark room!<br><br>Print on your own gear or clothes or purchase a shirt to support what will soon be NWA's only publicly available darkroom!</p></div>
